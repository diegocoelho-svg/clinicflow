[project]
name = "clinicflow"
version = "0.1.0"
description = "A local financial automation API for clinics."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.18",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
