name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: clinicflow-ci-${{ github.run_id }}-${{ github.run_attempt }}
      API_PORT: "8000"
      DJANGO_SECRET_KEY: ci-only-temporary-key-not-used-outside-the-disposable-test-environment
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: clinicflow
      POSTGRES_USER: clinicflow
      POSTGRES_PASSWORD: ci-only-temporary-password
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start API and PostgreSQL
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Check Django configuration
        run: docker compose exec -T api python manage.py check

      - name: Check migration consistency
        run: docker compose exec -T api python manage.py makemigrations --check --dry-run

      - name: Lint Python code
        run: docker compose exec -T api ruff check .

      - name: Check Python formatting
        run: docker compose exec -T api ruff format --check .

      - name: Run PostgreSQL-backed tests
        run: docker compose exec -T api pytest

      - name: Check installed dependencies
        run: docker compose exec -T api python -m pip check

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 api db

      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
