name: Discord notifications

on:
  pull_request_target:
    branches: [main]
    types: [opened, closed]
  workflow_run:
    workflows: [CI, Frontend CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Notify Discord
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
        (github.event.action == 'opened' ||
          (github.event.action == 'closed' && github.event.pull_request.merged == true))) ||
      (github.event_name == 'workflow_run' &&
        contains(fromJSON('["failure", "timed_out", "action_required", "startup_failure", "stale"]'),
          github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Always use trusted default-branch code, including for fork PRs and manual runs.
      # Never check out the PR head, download its artifacts, or execute its code here.
      - name: Check out trusted notification code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Send event notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/notify_discord.py
